// Moonlight (https://github.com/moonlight-stream/moonlight-android, GPL-3.0) built as a library
// inside RetroTV. Its source is downloaded into third_party/moonlight by settings.gradle.kts;
// this file builds that source unchanged, so nothing in Moonlight itself is patched.

apply plugin: 'com.android.library'

def ml = file("$rootDir/third_party/moonlight/app/src/main")

android {
    namespace 'com.limelight'
    compileSdk 34
    ndkVersion "23.2.8568313"

    defaultConfig {
        minSdk 21

        // Same values Moonlight's own "nonRoot" build uses.
        buildConfigField "boolean", "ROOT_BUILD", "false"
        // Libraries don't get APPLICATION_ID; Moonlight's poster provider expects it.
        buildConfigField "String", "APPLICATION_ID", "\"com.retrotv.app\""
        resValue "string", "app_label", "Moonlight"
        resValue "string", "app_label_root", "Moonlight (Root)"

        externalNativeBuild {
            ndkBuild {
                arguments "PRODUCT_FLAVOR=nonRoot"
            }
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ["$ml/java"]
            res.srcDirs = ["$ml/res"]
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "$ml/jni/Android.mk"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Exactly the libraries Moonlight v12.1 uses.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'org.jcodec:jcodec:0.2.3'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.okio:okio:1.17.5'
    implementation 'org.jmdns:jmdns:3.5.7'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
}
